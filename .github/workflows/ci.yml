name: ml-only

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PERFIL_EXECUCAO: ml-only
      ML_RISCO_HABILITADO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar perfil ml-only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ml.txt
      - name: pytest
        run: python -m pytest -q --cov=lib/ml --cov-report=term
